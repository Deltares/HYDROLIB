name: ci

on: [push, pull_request]

jobs:
  CI:
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: '3.10'
            environment: test-py310
          - python-version: '3.11'
            environment: test-py311
          - python-version: '3.12'
            environment: test-py312
          - python-version: '3.13'
            environment: test-py313
          - python-version: '3.14'
            environment: test-py314
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Pixi
        uses: prefix-dev/setup-pixi@v0.10.2
        with:
          pixi-version: v0.78.0
          cache: true
          environments: ${{ matrix.environment }}

      - name: Check lock file is up to date
        run: pixi lock --check

      - name: Test with pytest
        run: pixi run --environment ${{ matrix.environment }} --locked test

      - uses: codecov/codecov-action@v7
        env:
          CODECOV_TOKEN: ${{secrets.CODECOV_TOKEN}}

      # - name: Lint
      #   run: pixi run --environment ${{ matrix.environment }} --locked lint

  check-conda-exports:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Pixi
        uses: prefix-dev/setup-pixi@v0.10.2
        with:
          pixi-version: v0.78.0
          cache: true
          environments: test-py312

      - name: Regenerate Conda environment exports
        run: pixi run --environment test-py312 --locked export-conda-environments

      - name: Fail if exported environments are stale
        run: git diff --exit-code -- environment-win-64.yml environment-linux-64.yml

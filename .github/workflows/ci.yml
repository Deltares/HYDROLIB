name: ci

on: [push]

jobs:
  CI:
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'poetry'

      - name: Install Poetry
        run: pipx install poetry

      - name: Select Poetry Python
        run: poetry env use python

      - name: Show Python and Poetry environment
        run: |
          python --version
          poetry --version
          poetry env info
          poetry run python --version

      - name: Install dependencies
        if: matrix.python-version != '3.12'
        run: poetry install -vvv

      - name: Install dependencies with validation extra
        if: matrix.python-version == '3.12'
        run: poetry install --extras validation -vvv

      - name: Verify validation extra
        if: matrix.python-version == '3.12'
        run: |
          poetry show hydamo-validation
          poetry run python -c "import hydamo_validation; print('hydamo_validation OK')"

      - name: Test with pytest
        run: poetry run pytest -v -m "not slow and not plot and not dll" --cov=hydrolib --cov-report=xml --cov-report=term

      - uses: codecov/codecov-action@v4
        env:
          CODECOV_TOKEN: ${{secrets.CODECOV_TOKEN}}


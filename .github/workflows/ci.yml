name: ci

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
jobs:
  CI:
    strategy:
      fail-fast: false
      matrix:
        environment: ['py311', 'py312', 'py313', 'py314']
        os: [ubuntu-latest, windows-latest]

    runs-on: ${{ matrix.os }}

    concurrency:
      group: ${{ github.workflow }}-${{ matrix.os }}-${{ matrix.environment }}-${{ github.ref }}
      cancel-in-progress: true

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Pixi
        uses: prefix-dev/setup-pixi@9936258fee697aff89b3fed6ca1f80a382ef694e # v0.11.3
        with:
          pixi-version: v0.83.0
          cache: true
          environments: ${{ matrix.environment }}

      - name: Test with pytest
        run: pixi run --environment ${{ matrix.environment }} --locked test

      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7
        env:
          CODECOV_TOKEN: ${{secrets.CODECOV_TOKEN}}

      # - name: Lint
      #   run: pixi run --environment ${{ matrix.environment }} --locked lint

  check-conda-exports:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Set up Pixi
        uses: prefix-dev/setup-pixi@9936258fee697aff89b3fed6ca1f80a382ef694e # v0.11.3
        with:
          pixi-version: v0.83.0
          cache: true
          environments: py312

      - name: Regenerate Conda environment exports
        run: pixi run --environment py312 --locked export-conda-environments

      - name: Fail if exported environments are stale
        run: git diff --exit-code -- environment-win-64.yml environment-linux-64.yml

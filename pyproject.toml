[project]
name = "hydrolib"
version = "0.5.1" # Auto-updated by Commitizen during releases.
description = "HYDROLIB tools for hydrodynamic and hydrological modelling workflows"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "LGPL" }
authors = [{ name = "Deltares" }]
maintainers = [
  { name = "Arthur van Dam", email = "arthur.vandam@deltares.nl" },
  { name = "Ruud Hurkmans", email = "r.hurkmans@hkv.nl" },
]
dependencies = [
  "pandas>=2,<3", # TODO add support for pandas 3: https://github.com/Deltares/HYDROLIB/issues/225
  "python-dateutil>=2.8.2",
  "geopandas>=1,<2",
  "xarray>=2024",
  "pydantic>=2,<3",
  "meshkernel",
  "hydrolib-core>=1.5,<1.6",
  "numpy>=2,<2.5", # 2.5 pin can be removed once we move to pandas 3.0.6 or newer
  "matplotlib>=3.9",
  "openpyxl>=3",
  "scipy>=1.13",
  "tqdm>=4.66.1",
  "rasterio>=1.4",
  "netcdf4>=1.7.2",
  "cftime>=1.6",
  "rasterstats>=0.21", # uses pyogrio instead of fiona as default engine and supports python 3.14
  "dask>=2024",
  "pyogrio>=0.9",
  "folium>=0.18",
  "branca>=0.6",
  "jinja2>=3",
  "shapely>=2.0.2",
  "ipykernel>=7",
  "ipywidgets>=8",
  # specific gridgeom imports
  "pillow>=11",
]

[dependency-groups]
dev = [
  "pytest>=6.2",
  "pytest-cov>=2.11",
  "ruff>=0.12",
  "mypy>=0.910",
  "pre-commit>=3.7",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hydrolib"]

[tool.hatch.build.targets.sdist]
include = ["hydrolib"]

[tool.commitizen]
name = "cz_conventional_commits"
version_provider = "pep621" # Reads and bumps [project].version.
tag_format = "$version"
version_files = [
    "hydrolib/post/__init__.py",
    "hydrolib/dhydamo/__init__.py"
]
changelog_file = "docs/changelog.md"

[tool.ruff]
line-length = 88
target-version = "py311"
src = ["hydrolib", "tests"]

[tool.ruff.lint]
extend-select = ["I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short --durations=0"
markers = [
  "plot: tests that open plot windows",
  "slow: tests that are known to run slowly",
  "dll: tests that are dependent on Windows DLL's"
]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["win-64", "linux-64"]

[tool.pixi.pypi-dependencies]
hydrolib = { path = ".", editable = true }

# Tasks for the "dev" feature, whose dependencies come from [dependency-groups].
[tool.pixi.feature.dev.tasks]
test = "pytest -v -m 'not slow and not plot and not dll' --cov=hydrolib --cov-report=xml --cov-report=term"
lint = "ruff format --check . && ruff check hydrolib tests"
fix = "ruff format . && ruff check --fix hydrolib tests"
typecheck = "mypy hydrolib"

[tool.pixi.feature.docs.dependencies]
mkdocs = ">=1.6,<2.0"
mkdocs-material = ">=9.7,<10.0"
mkdocstrings = ">=1.0,<2.0"
mkdocstrings-python = ">=2.0,<3.0"
mkdocs-autorefs = ">=1.4,<2.0"
pymdown-extensions = ">=10.0,<11.0"
mkdocs-macros-plugin = ">=1.5,<2.0"
mkdocs-material-extensions = ">=1.3,<2.0"
mkdocs-monorepo-plugin = ">=1.1,<2.0"
# mkdocs caps click <8.3, so the conda solve would pick 8.2.1, which rasterstats
# (PyPI) excludes. The conda solve doesn't see PyPI constraints, so repeat it here.
click = "!=8.2.1"

[tool.pixi.feature.docs.pypi-dependencies]
# conda-forge tops out at 0.25.1; PyPI has the >=0.26 range the project pins.
mkdocs-jupyter = ">=0.26,<1.0"

[tool.pixi.feature.docs.tasks]
docs-build = "mkdocs build"

[tool.pixi.feature.release.dependencies]
commitizen = ">=4,<5"
python-build = "*"

[tool.pixi.feature.release.tasks]
build = "python -m build"

[tool.pixi.feature.py311.dependencies]
python = "3.11.*"

[tool.pixi.feature.py312.dependencies]
python = "3.12.*"

[tool.pixi.feature.py313.dependencies]
python = "3.13.*"

# [tool.pixi.feature.py314.dependencies]
# python = "3.14.*"

[tool.pixi.environments]
# The "dev" feature is the [dependency-groups] dev group, picked up by pixi.
default = ["dev", "py312"]
py311 = ["py311", "dev"]
py312 = ["py312", "dev"]
py313 = ["py313", "dev"]
# py314 = ["py314"]
docs = ["docs", "py312"]

[tool.pixi.environments.release]
#The release environment only bumps the version and builds the package, so it
# doesn't need the runtime stack from [project.dependencies].
features = ["release", "py312"]
no-default-feature = true

[tool.pixi.tasks]
lock-check = "pixi lock --check"
export-conda-environments = "pixi workspace export conda-environment environment-win-64.yml --environment py312 --platform win-64 --name hydrolib --from-lock-file && pixi workspace export conda-environment environment-linux-64.yml --environment py312 --platform linux-64 --name hydrolib --from-lock-file"

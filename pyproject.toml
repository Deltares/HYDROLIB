[project]
name = "hydrolib"
version = "0.5.1" # Auto-updated by Commitizen during releases.
description = "HYDROLIB tools for hydrodynamic and hydrological modelling workflows"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "LGPL" }
authors = [{ name = "Deltares" }]
maintainers = [
  { name = "Arthur van Dam", email = "arthur.vandam@deltares.nl" },
  { name = "Ruud Hurkmans", email = "r.hurkmans@hkv.nl" },
]
dependencies = [
  "pandas>=2,<3", # TODO add support for pandas 3: https://github.com/Deltares/HYDROLIB/issues/225
  "python-dateutil>=2.8.2",
  "geopandas>=1,<2",
  "xarray>=2024",
  "pydantic>=2,<3",
  # TypedDict that pydantic accepts on Python < 3.12 (complex controllers in drtc.py)
  # TODO: drop when the minimum Python is 3.12; use typing.TypedDict in drtc.py instead
  "typing_extensions>=4.6",
  # implicit dependency, specific version follows from hydrolib-core
  "meshkernel",
  # upper pin <2 because hydrolib-core will remove support for some quantities/blocks
  "hydrolib-core>=1.6.1,<2",
  # 2.5 pin can be removed once we move to pandas 3.0.6 or newer: https://github.com/pandas-dev/pandas/pull/66621
  # pandas 3 is not yet supported: https://github.com/Deltares/HYDROLIB/issues/225
  "numpy>=2,<2.5",
  "matplotlib>=3.9",
  "openpyxl>=3",
  "scipy>=1.13",
  "tqdm>=4.66.1",
  "rasterio>=1.4",
  "netcdf4>=1.7.2",
  "cftime>=1.6",
  "exactextract>=0.3",
  "dask>=2024",
  "pyogrio>=0.9",
  "folium>=0.18",
  "branca>=0.6",
  "jinja2>=3",
  # voronoi_polygons(ordered=True) in spatial.get_voronoi_around_nodes
  "shapely>=2.1",
  "ipykernel>=7",
  "ipywidgets>=8",
  # specific gridgeom imports
  "pillow>=11",
]

[project.optional-dependencies]
validation = [
  "hydamo-validation>=1.6.0",
  # hydamo-validation 1.6.0 imports fiona but doesn't declare it.
  "fiona>=1.10",
]

[dependency-groups]
dev = [
  "pytest>=6.2",
  "pytest-cov>=2.11",
  "ruff>=0.12",
  "mypy>=2.4",
  "pre-commit>=3.7",
  # type stubs for mypy; pandas-stubs follows the pandas major version
  "pandas-stubs>=2,<3",
  "types-geopandas",
  "types-shapely",
  # scipy-stubs requires Python >= 3.12; the py311 environment type-checks scipy as untyped
  "scipy-stubs; python_version >= '3.12'",
  "types-tqdm",
  "types-python-dateutil",
]
# update docs dependency versions https://github.com/Deltares/HYDROLIB/issues/246
docs = [
  "mkdocs>=1.6,<2.0",
  "mkdocs-material>=9.7,<10.0",
  "mkdocstrings>=1.0,<2.0",
  "mkdocstrings-python>=2.0,<3.0",
  "mkdocs-autorefs>=1.4,<2.0",
  # conda-forge tops out at 0.25.1; PyPI has the >=0.26 range the project pins.
  "mkdocs-jupyter>=0.26,<1.0",
  "pymdown-extensions>=10.21.3",
  "mkdocs-macros-plugin>=1.5,<2.0",
  "mkdocs-material-extensions>=1.3,<2.0",
  "mkdocs-monorepo-plugin>=1.1,<2.0",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hydrolib"]

[tool.hatch.build.targets.sdist]
include = ["hydrolib"]

[tool.commitizen]
name = "cz_conventional_commits"
version_provider = "pep621" # Reads and bumps [project].version.
tag_format = "$version"
version_files = [
    "hydrolib/post/__init__.py",
    "hydrolib/dhydamo/__init__.py"
]
changelog_file = "docs/changelog.md"

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["hydrolib", "tests"]
# deprecated, to be removed
extend-exclude = [
  "hydrolib/dhydamo/geometry/gridgeom",
  "hydrolib/dhydamo/geometry/mesh2d_gridgeom.py",
]
# also exclude them when a file is passed explicitly (IDE, pre-commit)
force-exclude = true

[tool.ruff.lint]
extend-select = ["I", "PD", "NPY", "PT", "D"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
# tests are documented by their names: no docstrings required for modules, classes and functions
"tests/**" = ["D100", "D101", "D102", "D103", "D104"]
# Copied from imod-python 0.10.1: docstrings kept as upstream
"hydrolib/dhydamo/io/idfreader.py" = ["D"]

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
# every function must have type hints: mypy skips the body of a function without them
disallow_untyped_defs = true
# understands pydantic models, e.g. hydrolib-core fields with camelCase aliases
plugins = ["pydantic.mypy"]
# deprecated, to be removed
exclude = [
  "hydrolib/dhydamo/geometry/gridgeom/",
  "hydrolib/dhydamo/geometry/mesh2d_gridgeom.py",
]

# Packages without type hints (no py.typed marker) and without stub packages.
[[tool.mypy.overrides]]
module = [
  "cftime.*",
  "exactextract.*",
  "meshkernel.*",
  "rasterio.*",
]
ignore_missing_imports = true

# hydrolib-core is fully annotated but has no py.typed marker: read its type hints anyway.
# It writes optional arguments as `name: str = None`, which implicit_optional reads as `str | None`.
[[tool.mypy.overrides]]
module = ["hydrolib.core.*"]
follow_untyped_imports = true
implicit_optional = true

# Copied from imod-python 0.10.1: only open() and affine_from_idf() have type hints.
[[tool.mypy.overrides]]
module = ["hydrolib.dhydamo.io.idfreader"]
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short --durations=0"
markers = [
  "plot: tests that open plot windows",
  "slow: tests that are known to run slowly",
  "dll: tests that are dependent on Windows DLL's",
  "requires_hydamo_validation: integration tests requiring hydamo-validation",
]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["win-64", "linux-64"]

[tool.pixi.pypi-dependencies]
hydrolib = { path = ".", editable = true }

# Tasks for the "dev" feature, whose dependencies come from [dependency-groups].
[tool.pixi.feature.dev.tasks]
test = "pytest -v -m 'not slow and not plot and not dll' --cov=hydrolib --cov-report=xml --cov-report=term"
lint = "ruff format --check hydrolib/dhydamo tests && ruff check hydrolib/dhydamo tests"
fix = "ruff format hydrolib/dhydamo tests && ruff check --fix hydrolib/dhydamo tests"
typecheck = "mypy hydrolib/dhydamo tests/dhydamo"
install-hooks = "pre-commit install"
lock-check = "pixi lock --check"
export-conda-environments = "pixi workspace export conda-environment environment-win-64.yml --environment py312 --platform win-64 --name hydrolib --from-lock-file && pixi workspace export conda-environment environment-linux-64.yml --environment py312 --platform linux-64 --name hydrolib --from-lock-file"

[tool.pixi.feature.docs.tasks]
docs-build = "mkdocs build"

[tool.pixi.feature.release.dependencies]
commitizen = ">=4,<5"
python-build = "*"

[tool.pixi.feature.release.tasks]
build = "python -m build"

[tool.pixi.feature.py311.dependencies]
python = "3.11.*"

[tool.pixi.feature.py312.dependencies]
python = "3.12.*"

[tool.pixi.feature.py313.dependencies]
python = "3.13.*"

[tool.pixi.feature.py314.dependencies]
python = "3.14.*"

[tool.pixi.environments]
# The "dev" feature is the [dependency-groups] dev group, picked up by pixi.
default = ["py312", "dev", "validation"]
py311 = ["py311", "dev"]
py312 = ["py312", "dev", "validation"]
py313 = ["py313", "dev"]
py314 = ["py314", "dev"]
docs = ["docs", "py312"]

[tool.pixi.environments.release]
#The release environment only bumps the version and builds the package, so it
# doesn't need the runtime stack from [project.dependencies].
features = ["release", "py312"]
no-default-feature = true
